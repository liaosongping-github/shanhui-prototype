<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>闪回 · 产品原型控制台</title><link rel="stylesheet" href="设计规范/基础样式-v1.css"><link rel="stylesheet" href="通用组件/原型导航-v1.css"></head><body><div class="console prototype-console"><main><header><h2 id="title"></h2><select id="version" aria-label="选择页面版本"></select><button id="compare" hidden>左右对照</button><button id="annotations" hidden>隐藏改动标注</button></header><iframe id="preview" title="页面原型预览"></iframe></main></div><script src="资源/原型配置.js"></script><script>
const config=window.prototypeConfig, selector=document.getElementById('version'), preview=document.getElementById('preview'), compare=document.getElementById('compare'), annotations=document.getElementById('annotations');let current;
function send(action){preview.contentWindow.postMessage({type:'prototype-review-command',action},'*');}
function load(){const version=current.versions.find(v=>v.id===selector.value);compare.hidden=annotations.hidden=version.role!=='iteration';compare.disabled=annotations.disabled=true;compare.textContent='左右对照';annotations.textContent='隐藏改动标注';preview.src=version.path+'?toolbar=parent';document.getElementById('title').textContent=current.name;}
function openPage(page){current=page;const visible=page.versions.filter(v=>!v.hidden);selector.replaceChildren(...visible.map(v=>new Option(v.label,v.id)));const requested=new URLSearchParams(location.search).get('version');selector.value=visible.some(v=>v.id===requested)?requested:visible.at(-1).id;load();}
selector.onchange=load;compare.onclick=()=>send('compare');annotations.onclick=()=>send('annotations');preview.onload=()=>send('state');
window.addEventListener('message',event=>{if(event.source!==preview.contentWindow||event.data?.type!=='prototype-review-state'||current.versions.find(v=>v.id===selector.value).role!=='iteration')return;compare.disabled=annotations.disabled=false;compare.textContent=event.data.comparing?'单页操作':'左右对照';annotations.textContent=event.data.annotations?'隐藏改动标注':'显示改动标注';});
const requestedPage=new URLSearchParams(location.search).get('page');openPage(config.pages.find(p=>p.id===requestedPage)||config.pages[0]);
</script></body></html>
