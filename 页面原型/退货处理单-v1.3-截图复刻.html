<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>退货处理单 · v1.3</title>
  <link rel="stylesheet" href="../设计规范/基础样式-v1.css">
  <link rel="stylesheet" href="../通用组件/原型导航-v1.css">
  <link rel="stylesheet" href="../通用组件/业务顶栏-v1.css">
  <link rel="stylesheet" href="../通用组件/改动评审-v1.css">
  <link rel="stylesheet" href="../通用组件/手动标注-v3.css">
  <link rel="stylesheet" href="../资源/退货处理单-v1.3.css">
</head>
<body>
  <div class="shell">
    <aside id="boss-sidebar" data-prototype-navigation></aside>
    <main class="boss-main">
      <header class="boss-top"></header>
      <div class="content return-page">
        <div class="breadcrumb">供应链 &gt; 仓库管理 &gt; <strong>退货处理单</strong>　<a href="#" id="favorite">☆ 收藏</a></div>
        <section class="filters">
          <form id="return-query">
            <div class="return-fields" id="return-fields"></div>
            <div class="return-toolbar" id="return-toolbar"></div>
          </form>
        </section>
        <section class="table-card">
          <div class="table-scroll return-scroll" tabindex="0" aria-label="退货处理单列表，可横向滚动">
            <table class="return-table"><thead id="return-head"></thead><tbody id="return-rows"></tbody></table>
          </div>
        </section>
        <div class="return-pagination">
          <span id="return-count"></span>
          <select id="return-size" aria-label="每页条数"><option value="10">10条/页</option><option value="20">20条/页</option></select>
          <nav id="return-pages" aria-label="分页"></nav>
        </div>
        <output id="return-message" aria-live="polite"></output>
        <dialog id="return-dialog">
          <h3 id="return-dialog-title"></h3>
          <div id="return-dialog-body"></div>
          <form method="dialog"><button class="btn">关闭</button></form>
        </dialog>
      </div>
    </main>
  </div>
  <script src="../通用组件/业务顶栏-v1.js"></script>
  <script src="../资源/原型配置.js"></script>
  <script src="../通用组件/原型导航-v2.js"></script>
  <script src="../资源/退货处理单-v1.3.js"></script>
  <script src="../资源/原型标注.js"></script>
  <script src="../通用组件/图文编辑-v3.js"></script>
  <script src="../通用组件/标注存储-v1.js"></script>
  <script src="../通用组件/手动标注-v3.js"></script>
</body>
</html>
